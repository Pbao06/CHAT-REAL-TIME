<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test SignalR Chat</title>
    <!-- Thư viện SignalR chạy qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #chatBox { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 8px; }
    </style>
</head>
<body>

    <h2>Test Chat Real-time (SignalR)</h2>
    
    <div>
        <label>Conversation ID:</label>
        <input type="text" id="convIdInput" value="1">
        <button id="btnJoin">Vào phòng (Join)</button>
    </div>

    <div id="chatBox"></div>

    <div>
        <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." style="width: 300px;">
        <!-- Lưu ý: Đoạn này bạn có thể gọi thẳng API SendMessage qua fetch hoặc test qua Swagger -->
        <p style="font-size: 12px; color: gray;">* Hãy dùng Swagger để gọi API gửi tin nhắn, trang này chỉ để nhận real-time thôi!</p>
    </div>

    <script>
        // 1. Kết nối tới Hub ở Backend (Nhớ sửa lại port cho đúng với localhost của bạn)
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("https://localhost:5001/chathub") 
            .withAutomaticReconnect()
            .build();

        // 2. Lắng nghe sự kiện "ReceiveMessage" từ Server đẩy xuống
        connection.on("ReceiveMessage", (message) => {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "message";
            div.innerHTML = `<b>Tin nhắn mới:</b> ${JSON.stringify(message)}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Tự cuộn xuống dưới
        });

        // 3. Bấm nút Join phòng
        document.getElementById("btnJoin").addEventListener("click", async () => {
            const conversationId = document.getElementById("convIdInput").value;
            try {
                await connection.invoke("JoinConversation", conversationId);
                alert("Đã vào phòng chat ID: " + conversationId);
            } catch (err) {
                console.error(err);
                alert("Lỗi join phòng!");
            }
        });

        // 4. Khởi động kết nối SignalR
        connection.start()
            .then(() => console.log("SignalR Connected Successfully!"))
            .catch(err => console.error("SignalR Connection Failed: ", err));
    </script>

</body>
</html>
